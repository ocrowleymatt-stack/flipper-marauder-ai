name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-vnext
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_vnext
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_vnext"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_vnext
      ATLAS_DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_vnext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: atlas-vnext/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Persistence / PostgreSQL
        run: npm run test:persistence
      - name: Files / projects / CAS / context
        run: npm run test:files
      - name: Tools / auth / Authority
        run: npm run test:tools
      - name: Caspa writing dungeon
        run: npm run test:caspa
      - name: Dungeon estate
        run: npm run test:estate
      - name: Production readiness gates
        run: npm run test:production
      - name: Production config contract
        run: |
          NODE_ENV=production \
          ATLAS_PERSISTENCE=postgres \
          ATLAS_DATABASE_URL=postgres://atlas:atlas@localhost:5432/atlas_vnext \
          ATLAS_TENANT_ID=tenant_ci \
          ATLAS_SESSION_SECRET=ci-session-secret-not-used-in-prod \
          ATLAS_ALLOWED_ORIGINS=http://127.0.0.1:8787 \
          ATLAS_CAS_ROOT=/tmp/atlas-ci-cas \
          ATLAS_DEPLOYMENT_TOPOLOGY=single-instance \
          npm run config:validate -- --production
          NODE_ENV=production \
          ATLAS_PERSISTENCE=postgres \
          ATLAS_DATABASE_URL=postgres://atlas:atlas@localhost:5432/atlas_vnext \
          ATLAS_ALLOW_MIGRATE=1 \
          npm run migrate
          NODE_ENV=production \
          ATLAS_PERSISTENCE=postgres \
          ATLAS_DATABASE_URL=postgres://atlas:atlas@localhost:5432/atlas_vnext \
          ATLAS_TENANT_ID=tenant_ci \
          ATLAS_SESSION_SECRET=ci-session-secret-not-used-in-prod \
          ATLAS_ALLOWED_ORIGINS=http://127.0.0.1:8787 \
          ATLAS_CAS_ROOT=/tmp/atlas-ci-cas \
          ATLAS_DEPLOYMENT_TOPOLOGY=single-instance \
          npm run cutover:preflight -- --production
      - name: Production refuses claimed HA topology
        run: |
          if NODE_ENV=production \
            ATLAS_PERSISTENCE=postgres \
            ATLAS_DATABASE_URL=postgres://atlas:atlas@localhost:5432/atlas_vnext \
            ATLAS_TENANT_ID=tenant_ci \
            ATLAS_SESSION_SECRET=ci-session-secret-not-used-in-prod \
            ATLAS_ALLOWED_ORIGINS=http://127.0.0.1:8787 \
            ATLAS_CAS_ROOT=/tmp/atlas-ci-cas \
            ATLAS_HA=1 \
            npm run config:validate -- --production; then
            echo "Production config must refuse ATLAS_HA=1" >&2
            exit 1
          fi
          if NODE_ENV=production \
            ATLAS_PERSISTENCE=postgres \
            ATLAS_DATABASE_URL=postgres://atlas:atlas@localhost:5432/atlas_vnext \
            ATLAS_TENANT_ID=tenant_ci \
            ATLAS_SESSION_SECRET=ci-session-secret-not-used-in-prod \
            ATLAS_ALLOWED_ORIGINS=http://127.0.0.1:8787 \
            ATLAS_CAS_ROOT=/tmp/atlas-ci-cas \
            ATLAS_REPLICAS=2 \
            npm run config:validate -- --production; then
            echo "Production config must refuse ATLAS_REPLICAS=2" >&2
            exit 1
          fi
          if NODE_ENV=production \
            ATLAS_PERSISTENCE=postgres \
            ATLAS_DATABASE_URL=postgres://atlas:atlas@localhost:5432/atlas_vnext \
            ATLAS_TENANT_ID=tenant_ci \
            ATLAS_SESSION_SECRET=ci-session-secret-not-used-in-prod \
            ATLAS_ALLOWED_ORIGINS=http://127.0.0.1:8787 \
            ATLAS_CAS_ROOT=/tmp/atlas-ci-cas \
            ATLAS_ACE_STEP=1 \
            npm run config:validate -- --production; then
            echo "Production config must refuse ATLAS_ACE_STEP=1" >&2
            exit 1
          fi
      - name: Classify dependency advisories
        run: npm run advisories:classify
      - name: Architecture boundary tests
        run: npm run test:boundaries
      - name: Provider / runtime tests
        run: npm run test:providers
      - name: Mountain behavioural compatibility
        run: npm run test:compat
      - name: Build
        run: npm run build
      - name: Workbench browser acceptance
        env:
          ATLAS_BROWSER_TEST: '1'
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run test:browser
