name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Lint Boundaries, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript packages
        run: npm run build

      - name: Check architecture boundaries
        run: npm run lint

      - name: Run unit & boundary tests
        run: npm test
